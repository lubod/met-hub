name: Build

on:
  push:
    branches: [master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REACT_APP_GOOGLE_CLIENT_ID: "dummy-client-id-for-ci"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - run: npx tailwindcss -o esdist/fe/tailwind.css
      - run: NODE_OPTIONS="--max-old-space-size=4096" node esbuild.mjs

      - name: Run ESLint
        run: npm run lint
      - name: Run Typecheck
        run: npx tsc --noEmit
      - name: Run unit and API tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha tag for rollbacks; mutable latest only from main,
      # which is the only branch that triggers this workflow.
      - name: Build and push met-hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: met-hub
          push: true
          tags: |
            ghcr.io/lubod/met-hub:${{ github.sha }}
            ghcr.io/lubod/met-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push met-hub-store
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: met-hub-store
          push: true
          tags: |
            ghcr.io/lubod/met-hub-store:${{ github.sha }}
            ghcr.io/lubod/met-hub-store:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
