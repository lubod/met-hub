# Default server configuration
#

server {
  listen 80;
  listen [::]:80;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1k;

  location / {  # the default location redirects to https
    return 301 https://$host$request_uri;
  }

  location /setData {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
  location /setDomData {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /weatherstation/updateweatherstation.php {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /data/report {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /api/ingest {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
# NOTE: snippets/self-signed.conf lives only on the deploy host; if absent,
# nginx will not start. Remove this include when Certbot certs are the sole source.
  # include snippets/self-signed.conf;
  include snippets/ssl-params.conf;

  root /usr/share/nginx/html;
  index index.html;

  server_name met-hub.com www.met-hub.com;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;


  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1k;

#    root /var/www/example.com/html;
#    index index.html index.htm index.nginx-debian.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location /icons/svg {
    try_files $uri $uri/ =404;
  }

  location /api {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /setData {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /setDomData {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /data/report {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /api/ingest {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /events {
    proxy_pass http://localhost:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }

  location /supervision {
    proxy_pass http://localhost:8001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }

  location /sapi {
    proxy_pass http://localhost:8001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }

  location /_next {
    proxy_pass http://localhost:8001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }

  location /files {
    proxy_pass http://localhost:8001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }

    ssl_certificate /etc/letsencrypt/live/www.met-hub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.met-hub.com/privkey.pem; # managed by Certbot
}

